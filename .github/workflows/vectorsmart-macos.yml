name: Gerar macOS VectorSmart

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: DMG macOS universal (Intel e Apple Silicon)
    runs-on: macos-15
    timeout-minutes: 180
    env:
      CRAFT_FONTS_REQUIRED: '1'
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4
      - name: Baixar fontes e licencas
        uses: actions/checkout@v4
        with:
          repository: storytold/craft-fonts
          ref: 3d9ab3a132ed0eff457e424226a435a901da30d3
          path: craft-fonts
      - name: Configurar Rust macOS
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          key: vectorsmart-macos-universal
      - name: Gerar aplicativo e DMG
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
        shell: bash
        run: bash packaging/macos/package.sh --arch universal
      - name: Conferir DMG e gerar checksums
        shell: bash
        run: |
          ls -lah dist/release
          test -n "$(find dist/release -maxdepth 1 -name '*-macos-universal.dmg' -print -quit)"
          (cd dist/release && shasum -a 256 *.dmg *.zip > SHA256SUMS-macos.txt)
      - name: Disponibilizar instaladores macOS
        uses: actions/upload-artifact@v4
        with:
          name: VectorSmart-macOS-universal
          path: |
            dist/release/*.dmg
            dist/release/*.zip
            dist/release/SHA256SUMS-macos.txt
          if-no-files-found: error
          retention-days: 30
