name: Publicar versão VectorSmart

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versão para publicar (ex.: 0.3.0). Deve coincidir com Cargo.toml."
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validar versão
        shell: pwsh
        env:
          APP_VERSION: ${{ inputs.version }}
        run: |
          if ($env:APP_VERSION -notmatch '^\d+\.\d+\.\d+$') { throw 'Versao invalida. Use 0.3.0, por exemplo.' }
      - name: Preparar Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
      - name: Instalar WiX
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2 WixToolset.Util.wixext/5.0.2
      - name: Criar MSI
        shell: pwsh
        run: ./packaging/windows/package.ps1 -Arch x64
      - name: Verificar instalador
        shell: pwsh
        run: |
          $files = @(Get-ChildItem dist/release/*.msi -ErrorAction SilentlyContinue)
          if ($files.Count -eq 0) { throw 'MSI nao encontrado em dist/release' }
          $files | Select-Object Name, Length
      - name: Publicar Release
        env:
          GH_TOKEN: ${{ github.token }}
          APP_VERSION: ${{ inputs.version }}
        shell: pwsh
        run: |
          $tag = "v$env:APP_VERSION"
          $existing = gh release view $tag --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) { throw "A versao $tag ja existe. Crie uma nova versao." }
          $files = @(Get-ChildItem dist/release/*.msi | ForEach-Object FullName)
          gh release create $tag @files --target $env:GITHUB_SHA --title "VectorSmart $tag" --notes "Instalador Windows x64. Faça backup dos seus projetos antes de atualizar."
