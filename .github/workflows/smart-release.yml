name: Publicar versão VectorSmart (Windows, Linux e macOS)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versão (ex.: 1.3.0). Deve coincidir com Cargo.toml."
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: vectorsmart-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  validar:
    name: Validar versão
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - name: Validar entrada
        id: check
        env:
          APP_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          [[ "$APP_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Use x.y.z'; exit 1; }
          echo "tag=v${APP_VERSION}" >> "$GITHUB_OUTPUT"
      - name: Confirmar que a versão não existe
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          if gh release view "${{ steps.check.outputs.tag }}" >/dev/null 2>&1; then
            echo 'Essa versão já foi publicada. Escolha uma nova versão.'
            exit 1
          fi
  windows:
    needs: validar
    name: Windows MSI x64
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validar versão
        shell: pwsh
        env:
          APP_VERSION: ${{ inputs.version }}
        run: |
          if ($env:APP_VERSION -notmatch '^\d+\.\d+\.\d+$') { throw 'Versao invalida. Use 0.3.0, por exemplo.' }
      - name: Preparar Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
      - name: Instalar WiX
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2 WixToolset.Util.wixext/5.0.2
      - name: Criar MSI
        shell: pwsh
        run: ./packaging/windows/package.ps1 -Arch x64
      - name: Verificar instalador
        shell: pwsh
        run: |
          $files = @(Get-ChildItem dist/release/*.msi -ErrorAction SilentlyContinue)
          if ($files.Count -eq 0) { throw 'MSI nao encontrado em dist/release' }
          $files | Select-Object Name, Length
      - name: Disponibilizar MSI para publicação
        uses: actions/upload-artifact@v4
        with:
          name: VectorSmart-Windows-x64
          path: dist/release/*.msi
          if-no-files-found: error
          retention-days: 30
  linux:
    needs: validar
    name: AppImage, DEB, RPM e TAR.GZ (x64)
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    env:
      NFPM_VERSION: '2.47.0'
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Baixar fontes licenciadas do projeto
        uses: actions/checkout@v4
        with:
          repository: storytold/craft-fonts
          ref: 3d9ab3a132ed0eff457e424226a435a901da30d3
          path: craft-fonts

      - name: Instalar dependencias Linux
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            curl ca-certificates pkg-config build-essential cmake clang libssl-dev \
            libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev \
            libgl1-mesa-dev desktop-file-utils appstream python3-yaml zsync
          curl -fsSL -o "$RUNNER_TEMP/nfpm.deb" \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_amd64.deb"
          sudo dpkg -i "$RUNNER_TEMP/nfpm.deb"

      - name: Preparar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache do Rust
        uses: Swatinem/rust-cache@v2
        with:
          key: smart-linux-x64

      - name: Compilar e empacotar
        shell: bash
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CRAFT_FONTS_REQUIRED: '1'
        run: bash packaging/linux/package.sh

      - name: Conferir arquivos gerados
        shell: bash
        run: |
          ls -lh dist/release/
          test -n "$(find dist/release -maxdepth 1 -name '*.AppImage' -print -quit)"
          test -n "$(find dist/release -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$(find dist/release -maxdepth 1 -name '*.rpm' -print -quit)"
          test -n "$(find dist/release -maxdepth 1 -name '*.tar.gz' -print -quit)"
          sha256sum dist/release/* > dist/release/SHA256SUMS.txt

      - name: Disponibilizar instaladores
        uses: actions/upload-artifact@v4
        with:
          name: VectorSmart-Linux-x64
          path: dist/release/*
          if-no-files-found: error
          retention-days: 30
  macos:
    needs: validar
    name: DMG macOS universal (Intel e Apple Silicon)
    runs-on: macos-15
    timeout-minutes: 180
    env:
      CRAFT_FONTS_REQUIRED: '1'
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4
      - name: Baixar fontes e licencas
        uses: actions/checkout@v4
        with:
          repository: storytold/craft-fonts
          ref: 3d9ab3a132ed0eff457e424226a435a901da30d3
          path: craft-fonts
      - name: Configurar Rust macOS
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          key: vectorsmart-macos-universal
      - name: Gerar aplicativo e DMG
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
        shell: bash
        run: bash packaging/macos/package.sh --arch universal
      - name: Conferir DMG e gerar checksums
        shell: bash
        run: |
          ls -lah dist/release
          test -n "$(find dist/release -maxdepth 1 -name '*-macos-universal.dmg' -print -quit)"
          (cd dist/release && shasum -a 256 ./*.dmg ./*.zip > SHA256SUMS-macos.txt)
      - name: Disponibilizar instaladores macOS
        uses: actions/upload-artifact@v4
        with:
          name: VectorSmart-macOS-universal
          path: |
            dist/release/*.dmg
            dist/release/*.zip
            dist/release/SHA256SUMS-macos.txt
          if-no-files-found: error
          retention-days: 30
  publicar:
    name: Publicar instaladores em uma Release
    needs: [validar, windows, linux, macos]
    if: ${{ success() }}
    runs-on: ubuntu-latest
    steps:
      - name: Baixar instaladores compilados
        uses: actions/download-artifact@v4
        with:
          path: instaladores
          merge-multiple: false
      - name: Conferir conteúdo
        shell: bash
        run: |
          find instaladores -type f -print
          test -n "$(find instaladores -type f -name '*.msi' -print -quit)"
          test -n "$(find instaladores -type f -name '*.AppImage' -print -quit)"
          test -n "$(find instaladores -type f -name '*.deb' -print -quit)"
          test -n "$(find instaladores -type f -name '*.rpm' -print -quit)"
          test -n "$(find instaladores -type f -name '*.dmg' -print -quit)"
      - name: Criar Release com todos os instaladores
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.validar.outputs.tag }}
        shell: bash
        run: |
          mapfile -d '' FILES < <(find instaladores -type f \( -name '*.msi' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '*.tar.gz' -o -name '*.dmg' -o -name '*.zip' \) -print0)
          test "${#FILES[@]}" -gt 0
          gh release create "$TAG" "${FILES[@]}" --target "$GITHUB_SHA" --title "VectorSmart $TAG" --notes "Instaladores Windows x64, Linux x64 e macOS universal (Intel/Apple Silicon). iOS ainda em desenvolvimento. No macOS, o aplicativo pode exigir autorização manual de abertura enquanto não houver assinatura/notarização."
